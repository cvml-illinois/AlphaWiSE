# The 840 exemplar checkpoint registry: the map from a method key to the run directory it
# was trained into. This replaces the block of absolute paths that used to sit at the top
# of the evaluation scripts. Every run in it used the 840 exemplar memory.
#
# Roots are expressed against two environment supplied prefixes. Point
# ALPHAWISE_EXTERNAL_CHECKPOINTS at wherever the released weights were unpacked, and
# ALPHAWISE_CHECKPOINTS at whatever this repository trained itself.
#
# filename: null means "take the highest numbered model_weights_epoch_<N>.pth present".
#
# Every method entry declares phases 1..7, the trained phases the paper reports. Phase 0
# is the shared bootstrap and lives in its own entry per class order: folding it into a
# method's phase list is what once let the Average column silently include the bootstrap.
# Forward transfer is measured against the bootstrap entry, which by protocol is the same
# frozen checkpoint every method's trajectory started from.
checkpoints:
  # New method keys are added here, not in base.yaml, so overrides may create them.
  __open__: true
  # The filename the fused runs were released under. It predates the AlphaWiSE name and is
  # kept verbatim because it matches the released fused checkpoints on disk.
  alphawise_filename: learnable_wiseft_model.pth
  registry:
    forward:
      bootstrap: {root: "${paths.bootstrap_root}/forward", filename: model_weights_epoch_30.pth, phases: [0]}
      normal: {root: "${paths.external_checkpoint_root}/normal_840_forward", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      lwf: {root: "${paths.external_checkpoint_root}/lwf_840_forward", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      vlwf: {root: "${paths.external_checkpoint_root}/vlwf_840_forward", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      ewc: {root: "${paths.external_checkpoint_root}/ewc_840_forward", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      der: {root: "${paths.checkpoint_root}/der_forward", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      icarl: {root: "${paths.checkpoint_root}/icarl_forward", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      cclip: {root: "${paths.checkpoint_root}/cclip_forward", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      alphawise_n_ewc: {root: "${paths.external_checkpoint_root}/alphawise_n_ewc_840_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      alphawise_n_icarl: {root: "${paths.external_checkpoint_root}/alphawise_n_icarl_840_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      alphawise_n_lwf: {root: "${paths.external_checkpoint_root}/alphawise_n_lwf_840_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      wiseft_n_ewc: {root: "${paths.external_checkpoint_root}/wiseft_half_n_ewc_840_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      wiseft_n_icarl: {root: "${paths.external_checkpoint_root}/wiseft_half_n_icarl_840_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      wiseft_n_lwf: {root: "${paths.external_checkpoint_root}/wiseft_half_n_lwf_840_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      # The Table 2 refits of the N+EWC pair under each coefficient objective. These are
      # produced locally by `python -m alphawise.reproduce --artifact objective_ablation`, so their
      # roots sit under the local checkpoint root rather than the released weights.
      alphawise_n_ewc_obj_a2t: {root: "${paths.checkpoint_root}/alphawise_n_ewc_obj_a2t_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      alphawise_n_ewc_obj_i2a: {root: "${paths.checkpoint_root}/alphawise_n_ewc_obj_i2a_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      alphawise_n_ewc_obj_i2t: {root: "${paths.checkpoint_root}/alphawise_n_ewc_obj_i2t_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
      alphawise_n_ewc_obj_joint: {root: "${paths.checkpoint_root}/alphawise_n_ewc_obj_joint_forward", filename: "${checkpoints.alphawise_filename}", phases: [1, 2, 3, 4, 5, 6, 7]}
    reverse:
      bootstrap: {root: "${paths.bootstrap_root}/reverse", filename: model_weights_epoch_30.pth, phases: [0]}
      # The upstream directory names encoded the distillation weight rather than the
      # method, so they are renamed here by what they actually are.
      normal: {root: "${paths.external_checkpoint_root}/normal_840_reverse", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      lwf: {root: "${paths.external_checkpoint_root}/lwf_840_reverse", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      # Phase 1 of the reverse vlwf run did not survive; the gap is deliberate.
      vlwf: {root: "${paths.external_checkpoint_root}/vlwf_840_reverse", filename: null, phases: [2, 3, 4, 5, 6, 7]}
      ewc: {root: "${paths.external_checkpoint_root}/ewc_840_reverse", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      der: {root: "${paths.checkpoint_root}/der_reverse", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      icarl: {root: "${paths.checkpoint_root}/icarl_reverse", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      cclip: {root: "${paths.checkpoint_root}/cclip_reverse", filename: null, phases: [1, 2, 3, 4, 5, 6, 7]}
      alphawise_ewc_lwf: {root: "${paths.external_checkpoint_root}/alphawise_ewc_lwf_840_reverse", filename: "${checkpoints.alphawise_filename}", phases: [2, 3, 4, 5, 6, 7]}
